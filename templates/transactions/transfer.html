{% extends 'base.html' %}
{% block content %}

<style>
.deposit-bg {
    position: relative;
    background: url("https://i.pinimg.com/736x/ad/fc/be/adfcbe1c9ac56d82b71513fea3e038a2.jpg") no-repeat center center fixed;
    background-size: cover;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 0;
}

.deposit-bg::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(255, 255, 255, 0.5);
    z-index: 0;
}

.deposit-card {
    position: relative;
    z-index: 1;
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(5px);
    padding: 30px;
    border-radius: 15px;
    width: 100%;
    max-width: 500px;
    box-shadow: 0 0 15px rgba(0,0,0,0.2);
}
</style>

<div class="deposit-bg">
  <div class="deposit-card">
    <h2 class="text-center mb-4" style="color: #004080;">
      <i class="fas fa-exchange-alt"></i> Transfer Money
    </h2>

    {% if messages %}
      {% for msg in messages %}
        <div class="alert alert-{{ msg.tags }} text-center">{{ msg }}</div>
      {% endfor %}
    {% endif %}

    <form method="post" novalidate>
      {% csrf_token %}
      {{ form.as_p }}
      <div class="d-grid mt-3">
        <button type="submit" class="btn btn-primary btn-lg" style="border-radius: 10px;">
          Transfer
        </button>
      </div>
    </form>

    <div class="text-center mt-3">
      <a href="{% url 'dashboard' %}" class="btn btn-secondary">Back to Dashboard</a>
      <a href="{% url 'history' %}" class="btn btn-info">Transaction History</a>
    </div>
  </div>
</div>

{% endblock %}
