{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h2>Transaction History</h2>
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Date</th>
        <th>Type</th>
        <th>Sender</th>
        <th>Receiver</th>
        <th>Amount</th>
      </tr>
    </thead>
    <tbody>
      {% for tx in transactions %}
      <tr>
        <td>{{ tx.timestamp }}</td>
        <td>{{ tx.transaction_type }}</td>
        <td>{{ tx.sender }}</td>
        <td>{{ tx.receiver }}</td>
        <td>₹{{ tx.amount }}</td>
      </tr>
      {% empty %}
      <tr><td colspan="5">No transactions yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
