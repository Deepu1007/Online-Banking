{% extends 'base.html' %}
{% block content %}

<style>
.deposit-bg {
    position: relative; /* important for overlay */
    background: url("https://i.pinimg.com/736x/39/db/e7/39dbe7fe838402cf03258333deb05509.jpg") no-repeat center center fixed;
    background-size: cover;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 0;
}

/* White overlay to lighten the background */
.deposit-bg::before {
    content: "";              /* required for pseudo-element */
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(255, 255, 255, 0.5); /* adjust 0.5 for lighter/darker */
    z-index: 0;               /* behind the card */
}

.deposit-card {
    position: relative;       /* above overlay */
    z-index: 1;
    background: rgba(255, 255, 255, 0.8); /* card opacity */
    backdrop-filter: blur(5px);
    padding: 30px;
    border-radius: 12px;
    width: 100%;
    max-width: 450px;
    box-shadow: 0 0 12px rgba(0,0,0,0.15);
}
</style>

<div class="deposit-bg">
    <div class="deposit-card">
        <h3 class="text-center mb-4">Deposit to your account</h3>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="amount" class="form-label">Amount</label>
                <input type="number" step="0.01" name="amount" id="amount" class="form-control" required>
            </div>
            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-success">Deposit</button>
                <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
