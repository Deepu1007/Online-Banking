<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Set New Password - MyBank</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { background:#f4f6f9; display:flex; align-items:center; justify-content:center; height:100vh; }
    .card { max-width:420px; border-radius:15px; border:none; }
    h2 { color:#004080; font-weight:bold; }
    .btn-primary { background:#004080; border:none; border-radius:10px; }
  </style>
</head>
<body>
  <div class="card shadow-lg p-4">
    <h2 class="text-center mb-4"><i class="fas fa-lock-open"></i> Set New Password</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="d-grid mt-3">
        <button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-save"></i> Save New Password</button>
      </div>
    </form>
  </div>
</body>
</html>
