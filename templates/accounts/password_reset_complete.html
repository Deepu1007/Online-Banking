<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Password Reset Complete - MyBank</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { background:#f4f6f9; display:flex; align-items:center; justify-content:center; height:100vh; }
    .card { max-width:420px; border-radius:15px; border:none; }
    h2 { color:#004080; font-weight:bold; }
  </style>
</head>
<body>
  <div class="card shadow-lg p-4 text-center">
    <h2><i class="fas fa-check-circle text-success"></i> Password Reset Complete</h2>
    <p class="mt-3 text-muted">Your password has been reset successfully. You can now log in with your new password.</p>
    <a href="{% url 'login' %}" class="btn btn-primary mt-3"><i class="fas fa-sign-in-alt"></i> Go to Login</a>
  </div>
</body>
</html>
