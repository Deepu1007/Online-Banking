<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Register - MyBank</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(rgba(0,64,128,0.8), rgba(0,64,128,0.8)), 
                  url("https://images.unsplash.com/photo-1563013544-824ae1b704d3?auto=format&fit=crop&w=1500&q=80") 
                  no-repeat center center fixed;
      background-size: cover;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
    .register-container {
      max-width: 450px;
      margin: 80px auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .register-container h2 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: bold;
      color: #004080;
    }
    .btn-custom {
      background-color: #004080;
      color: #fff;
      font-weight: 500;
    }
    .btn-custom:hover {
      background-color: #003366;
    }
    a {
      text-decoration: none;
      color: #004080;
      font-weight: 500;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="register-container">
  <h2><i class="fas fa-user-plus"></i> Open an Account</h2>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <div class="d-grid mt-3">
      <button type="submit" class="btn btn-custom">Register</button>
    </div>
  </form>
  <p class="text-center mt-3">
    Already have an account? <a href="{% url 'login' %}">Login here</a></br>
    <a href="{% url 'home' %}">BACK</a>
  </p>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
