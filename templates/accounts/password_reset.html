<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Password Reset - MyBank</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      background: #f4f6f9;
      display: flex; align-items: center; justify-content: center;
      height: 100vh; font-family: 'Segoe UI', sans-serif;
    }
    .card { max-width: 420px; border-radius: 15px; border: none; }
    h2 { color: #004080; font-weight: bold; }
    .btn-primary { background: #004080; border: none; border-radius: 10px; }
    .btn-primary:hover { background: #003366; }
  </style>
</head>
<body>
  <div class="card shadow-lg p-4">
    <h2 class="text-center mb-3"><i class="fas fa-key"></i> Reset Password</h2>
    <p class="text-muted text-center">Enter your registered email address. We’ll send you a link to reset your password.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.email.label_tag }}
      {{ form.email }}
      <div class="d-grid mt-3">
        <button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-envelope"></i> Send Reset Link</button>
      </div>
    </form>
    <p class="text-center mt-3"><a href="{% url 'login' %}" style="color:#004080;">Back to Login</a></p>
  </div>
</body>
</html>
