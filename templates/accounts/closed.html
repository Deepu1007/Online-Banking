{% extends "base.html" %}
{% block title %}Account Locked{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-lg border-0 rounded-3 text-center">
        <div class="card-header bg-danger text-white">
          <h4><i class="fas fa-lock"></i> Account Locked</h4>
        </div>
        <div class="card-body">
          <p class="lead text-danger mb-3">
            Your account has been <strong>blocked</strong> by your parent account holder 
            <span class="fw-bold">{{ parent_name }}</span>.
          </p>
          <p class="text-muted">
            Please try again later or contact your parent account holder for assistance.
          </p>
          <a href="{% url 'login' %}" class="btn btn-primary mt-3">
            <i class="fas fa-sign-in-alt"></i> Back to Login
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
