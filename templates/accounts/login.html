<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login - Guardian Bank</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* Full-page background image with overlay */
    body {
      height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: 
        linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
        url('https://images.unsplash.com/photo-1581091012184-5a5f6a11867b?auto=format&fit=crop&w=1500&q=80') no-repeat center center;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Login Card */
    .card {
      width: 100%;
      max-width: 420px;
      border-radius: 15px;
      border: none;
      background-color: rgba(255,255,255,0.95);
      padding: 30px 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 35px rgba(0,0,0,0.25);
    }

    h2 {
      color: #004080;
      font-weight: bold;
    }

    /* Buttons */
    .btn-primary {
      background-color: #004080;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      transition: background 0.3s, transform 0.3s;
    }
    .btn-primary:hover {
      background-color: #003366;
      transform: translateY(-2px);
    }

    /* Links */
    a {
      transition: color 0.3s;
      text-decoration: none;
    }
    a:hover {
      color: #ffdd57;
      text-decoration: underline;
    }

    /* Form labels */
    .form-label {
      font-weight: 500;
    }

    /* Alerts */
    .alert {
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card shadow-lg">
    <h2 class="text-center mb-4"><i class="fas fa-user-lock"></i> Secure Login</h2>

    {% if messages %}
      {% for msg in messages %}
        <div class="alert alert-{{ msg.tags }} text-center">{{ msg }}</div>
      {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="id_username" class="form-label">Username</label>
        <input type="text" name="username" class="form-control" id="id_username" placeholder="Enter username" required>
      </div>
      <div class="mb-3">
        <label for="id_password" class="form-label">Password</label>
        <input type="password" name="password" class="form-control" id="id_password" placeholder="Enter password" required>
      </div>
      <div class="d-grid mt-4">
        <button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-sign-in-alt"></i> Login</button>
      </div>
    </form>

    <div class="text-center mt-3">
      <p class="mb-1">Don’t have an account? <a href="{% url 'register' %}">Register here</a></p>
      <p><a href="{% url 'password_reset' %}">Forgot Password?</a></p>
      <p><a href="{% url 'home' %}">BACK</a></p>
    </div>
  </div>
</body>
</html>
